name: Build and Publish Snapshots

on:
  push:
    branches: [develop, next]
  workflow_dispatch:
    inputs:
      publish-snapshots:
        description: "Also publish the SNAPSHOT to Maven Central (snapshots always go to zenwave360/maven-snapshots)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maven-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-snapshot:
    # Pilot for git-maven-publisher snapshots (zenwave360/maven-snapshots, branch main); back to @main once merged there.
    uses: ZenWave360/release-workflows/.github/workflows/publish-snapshots-maven.yml@feature/git-snapshots
    with:
      publish-snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.publish-snapshots }}
      publish-git-snapshots: true
      java-version: "17"
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
      GIT_PUBLISHER_TOKEN: ${{ secrets.GIT_PUBLISHER_TOKEN }}

