name: Verify Latest SNAPSHOT versions from SpringBoot and Modulith

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2 AM
  workflow_dispatch:

jobs:
  verify-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Detect latest Spring Modulith SNAPSHOT and update parent POM
        id: versions
        run: |
          MODULITH_SNAPSHOT=$(curl -s "https://repo.spring.io/snapshot/org/springframework/modulith/spring-modulith-events/maven-metadata.xml" | grep -oP '<version>2\.[0-9]+\.[0-9]+-SNAPSHOT</version>' | grep -oP '2\.[0-9]+\.[0-9]+-SNAPSHOT' | sort -V | tail -1)
          SPRING_BOOT_VERSION=$(curl -s "https://repo.spring.io/snapshot/org/springframework/boot/spring-boot-dependencies/maven-metadata.xml" | grep '<version>4\.[0-9]*\.[0-9]*-SNAPSHOT</version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | sort -V | tail -1)
          SPRING_CLOUD_VERSION=$(curl -s "https://repo.spring.io/snapshot/org/springframework/cloud/spring-cloud-dependencies/maven-metadata.xml" | grep '<version>2025\.[0-9]*\.[0-9]*-SNAPSHOT</version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | sort -V | tail -1)
          SPRING_CLOUD_STREAM_SCHEMA_VERSION=$(curl -s "https://repo.spring.io/snapshot/org/springframework/cloud/spring-cloud-stream-schema/maven-metadata.xml" | grep '<version>[0-9]*\.[0-9]*\.[0-9]*.*</version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | sort -V | tail -1)

          echo "MODULITH_SNAPSHOT=$MODULITH_SNAPSHOT" >> $GITHUB_OUTPUT
          echo "SPRING_BOOT_VERSION=$SPRING_BOOT_VERSION" >> $GITHUB_ENV
          echo "SPRING_CLOUD_VERSION=$SPRING_CLOUD_VERSION" >> $GITHUB_ENV
          echo "SPRING_CLOUD_STREAM_SCHEMA_VERSION=$SPRING_CLOUD_STREAM_SCHEMA_VERSION" >> $GITHUB_ENV

          if [ -z "$MODULITH_SNAPSHOT" ]; then
            echo "No Spring Modulith SNAPSHOT found, skipping build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            mvn versions:update-parent -DparentVersion=${MODULITH_SNAPSHOT} -DskipResolution=true -DgenerateBackupPoms=false
            mvn versions:set-property -Dproperty=spring-boot.version -DnewVersion=${SPRING_BOOT_VERSION} -DgenerateBackupPoms=false
            mvn versions:set-property -Dproperty=spring-cloud.version -DnewVersion=${SPRING_CLOUD_VERSION} -DgenerateBackupPoms=false
            mvn versions:set-property -Dproperty=spring-cloud-stream-schema.version -DnewVersion=${SPRING_CLOUD_STREAM_SCHEMA_VERSION} -DgenerateBackupPoms=false
          fi

      - name: Debug versions
        if: steps.versions.outputs.skip == 'false'
        run: |
          echo "Spring Modulith SNAPSHOT: ${{ steps.versions.outputs.MODULITH_SNAPSHOT }}"
          echo "Spring Boot version: ${SPRING_BOOT_VERSION}"
          echo "Spring Cloud version: ${SPRING_CLOUD_VERSION}"
          echo "Spring Cloud Stream Schema version: ${SPRING_CLOUD_STREAM_SCHEMA_VERSION}"
          mvn dependency:tree -q -B

      - name: Verify with latest SNAPSHOT
        if: steps.versions.outputs.skip == 'false'
        run: mvn clean verify -B
