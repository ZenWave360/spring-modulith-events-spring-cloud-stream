name: Update Spring-Modulith Parent POM Version 2.x

on:
  schedule:
    - cron: '0 1 * * *' # Runs daily at 1 AM (1 hour after the 1.4.x workflow)
  workflow_dispatch:

jobs:
  update-parent-pom-2x:
    runs-on: ubuntu-latest

    # main only tracks stable (GA) releases; next tracks the newest version,
    # including pre-releases (RC/M), so API changes are absorbed there first.
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            allow-prerelease: false
          - branch: next
            allow-prerelease: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Update parent POM version to 2.x
        id: update-parent-pom
        env:
          ALLOW_PRERELEASE: ${{ matrix.allow-prerelease }}
        run: |
          # Picks the highest stable (non-qualified) version. When pre-releases are
          # allowed, only falls back to a pre-release (RC/M/SNAPSHOT) when its X.Y.Z is
          # strictly newer than any stable release published so far, so an already-GA'd
          # version never gets "upgraded" back to its own RC (maven-metadata keeps RC
          # entries forever, and plain `sort -V` ranks "2.1.0-RC1" above "2.1.0").
          pick_latest() {
            local all_versions="$1"
            local stable prerelease stable_base prerelease_base
            stable=$(echo "$all_versions" | grep -vP -- '-' | sort -V | tail -1)
            if [[ "$ALLOW_PRERELEASE" != "true" ]]; then
              echo "$stable"
              return
            fi
            prerelease=$(echo "$all_versions" | grep -P -- '-' | sort -V | tail -1)
            stable_base=${stable:-0.0.0}
            prerelease_base=$(echo "$prerelease" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+')
            prerelease_base=${prerelease_base:-0.0.0}
            if [[ -n "$prerelease" && "$stable_base" != "$prerelease_base" && \
                  "$(printf '%s\n%s\n' "$stable_base" "$prerelease_base" | sort -V | tail -1)" == "$prerelease_base" ]]; then
              echo "$prerelease"
            else
              echo "$stable"
            fi
          }

          MODULITH_VERSIONS=$(curl -s "https://repo1.maven.org/maven2/org/springframework/modulith/spring-modulith-events/maven-metadata.xml" | grep -oP '<version>2\.[0-9]+\.[0-9]+(-[A-Z0-9]+)?</version>' | grep -oP '2\.[0-9]+\.[0-9]+(-[A-Z0-9]+)?')
          NEW_VERSION=$(pick_latest "$MODULITH_VERSIONS")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Get latest Spring Boot 4.x version, same stable-over-prerelease rule
          SPRING_BOOT_VERSIONS=$(curl -s "https://repo1.maven.org/maven2/org/springframework/boot/spring-boot/maven-metadata.xml" | grep -oP '<version>4\.[0-9]+\.[0-9]+(-[A-Z0-9]+)?</version>' | grep -oP '4\.[0-9]+\.[0-9]+(-[A-Z0-9]+)?')
          SPRING_BOOT_VERSION=$(pick_latest "$SPRING_BOOT_VERSIONS")
          echo "SPRING_BOOT_VERSION=$SPRING_BOOT_VERSION" >> $GITHUB_OUTPUT

          echo "Target branch: ${{ matrix.branch }}"
          echo "Spring Modulith version: $NEW_VERSION"
          echo "Spring Boot version: $SPRING_BOOT_VERSION"

          mvn versions:update-parent -DparentVersion=${NEW_VERSION} -DskipResolution=true -DgenerateBackupPoms=false
          mvn versions:set-property -Dproperty=spring-boot.version -DnewVersion=${SPRING_BOOT_VERSION} -DgenerateBackupPoms=false

      - name: Debug updated versions
        run: |
          echo "Updated Spring Modulith version: ${{ steps.update-parent-pom.outputs.NEW_VERSION }}"
          echo "Updated Spring Boot version: ${{ steps.update-parent-pom.outputs.SPRING_BOOT_VERSION }}"
          mvn dependency:tree -q -B | grep -E "(spring-modulith|spring-boot)" || true

      - name: Build with new parent version
        run: mvn clean verify -B

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'Update Spring-Modulith Parent POM to ${{ steps.update-parent-pom.outputs.NEW_VERSION }} and Spring Boot to ${{ steps.update-parent-pom.outputs.SPRING_BOOT_VERSION }}'
          base: ${{ matrix.branch }}
          branch: update-parent-pom-2x-${{ matrix.branch }}-${{ steps.update-parent-pom.outputs.NEW_VERSION }}
          title: '[${{ matrix.branch }}] Update Spring-Modulith Parent POM to ${{ steps.update-parent-pom.outputs.NEW_VERSION }} and Spring Boot to ${{ steps.update-parent-pom.outputs.SPRING_BOOT_VERSION }}'
          body: 'This PR updates Spring-Modulith Parent POM to ${{ steps.update-parent-pom.outputs.NEW_VERSION }} and Spring Boot to ${{ steps.update-parent-pom.outputs.SPRING_BOOT_VERSION }} for Spring Boot 4 compatibility'
          labels: 'dependencies'
